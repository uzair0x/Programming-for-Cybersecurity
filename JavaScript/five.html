<!DOCTYPE html>
<html lang="en">
<head>
    <title>Prompt Dialog Box </title>

</head>
<body>
    <script>
        let name = window.prompt("What is your name?", "Wick lakan");
        name = name ? name : "anonymous";
        let age = prompt("Hellow " + name + ", how old are you?");
        alert(name + " is " + age + " years old ");
    </script>
    
</body>
</html>
